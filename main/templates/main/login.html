<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Gestão de Engenharia</title>
</head>
<body>
    <div style="width: 300px; margin: 100px auto; font-family: Arial, sans-serif;">
        <h2>Acesso Restrito</h2>
        
        {% if form.errors %}
            <p style="color: red;">Utilizador ou senha incorretos. Tente novamente.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" style="width: 100%; padding: 10px;">Entrar</button>
        </form>
    </div>
</body>
</html>
